<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Monchhichi GLB</title><style>body{font:16px system-ui;max-width:42rem;padding:2rem;margin:auto;background:#fff3f8;color:#70324e}button{min-height:44px;padding:12px 24px;border:0;border-radius:12px;background:#aa2a61;color:white}a{color:#aa2a61}</style></head><body><h1>Monchhichi model authoring</h1><p>สร้าง GLB จาก Meshy ต้นฉบับพร้อม rig และแอนิเมชั่น แล้วดาวน์โหลดเพื่อนำไปตรวจในพรีวิว</p><button id="build">สร้างและดาวน์โหลด GLB</button><p role="status" id="status"></p><a href="../?preview=monchhichi">กลับไปพรีวิว</a><script type="module">
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';import {createMonchhichi,disposeMonchhichi} from '../src/monchhichi-model.ts';
const button=document.getElementById('build'),status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;status.textContent='กำลังขึ้นรูปและเตรียมท่าทาง…';let model;try{const source=await new GLTFLoader().loadAsync('../assets/models/monchhichi-meshy-source.glb');model=createMonchhichi(source);const data=await new GLTFExporter().parseAsync(model.root,{binary:true,animations:model.clips});const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='monchhichi.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='ดาวน์โหลดแล้ว นำไปแทนไฟล์ GLB และตรวจในพรีวิวก่อนใช้งาน';}catch(e){status.textContent='สร้างไม่สำเร็จ: '+e.message;}finally{if(model)disposeMonchhichi(model.root);button.disabled=false;}};
</script></body></html>
